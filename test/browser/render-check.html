<!doctype html>
<html><head><meta charset="utf-8"><title>Renderer check</title></head>
<body>
<canvas id="c" width="200" height="200" style="width:200px;height:200px"></canvas>
<script type="module">
// Draws a known scene with the requested backend and reports pixel colours,
// so the WebGPU and WebGL2 paths can be checked headlessly.
import { createRenderer, fitView } from '../../src/app/render.js';
const prefer = new URLSearchParams(location.search).get('r') || 'auto';
const { renderer, canvas } = await createRenderer(document.getElementById('c'), prefer);
const W = 10, H = 10;
const bg = new Uint8Array(W * H * 4);
for (let s = 0; s < W * H; s++) { bg[s * 4] = 0; bg[s * 4 + 1] = 0; bg[s * 4 + 2] = 255; bg[s * 4 + 3] = s % W < 5 ? 255 : 0; }
renderer.setSpecies([{ color: [1, 0, 0], radius: 0.45 }], [0, 1, 0], [1, 1, 1]);
renderer.setBackground(bg, W, H);
const view = fitView(200, 200, [0, 0, 10, 10]);
const scene = { view, parts: new Float32Array([7.5, 7.5, 0, 0]), nParts: 1, trail: null, clear: [0, 1, 0] };
if (renderer.kind === 'WebGPU') {
  const px = await new Promise((res) => { renderer.capture = res; renderer.draw(scene); });
  window.result = { kind: renderer.kind, left: px(20, 100), right: px(180, 20), particle: px(150, 150) };
  document.title = 'done';
  throw 'stop';
}
renderer.draw(scene);
const img = new Image();
img.src = canvas.toDataURL();
await img.decode();
const c2 = document.createElement('canvas'); c2.width = 200; c2.height = 200;
const g = c2.getContext('2d'); g.drawImage(img, 0, 0);
const px = (x, y) => Array.from(g.getImageData(x, y, 1, 1).data);
window.result = { kind: renderer.kind, left: px(20, 100), right: px(180, 20), particle: px(150, 150) };
document.title = 'done';
</script>
</body></html>
