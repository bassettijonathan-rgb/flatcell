name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Kinetics and determinism tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: flatcell-page
          path: dist/

  browser:
    name: Artifact page boots in a sandboxed frame
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node test/browser/artifact-check.mjs
